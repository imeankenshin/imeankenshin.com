name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://imeankenshin.com
    env:
      # Optional: a PostHog personal API key with error tracking write access, for source map uploads
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
        env:
          # Inlined into the client bundle at build time (public values, not secrets)
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
          # Client source maps for PostHog error tracking, only when the next step can upload them
          CLIENT_SOURCEMAPS: ${{ env.POSTHOG_CLI_API_KEY != '' }}
      # Uploads the client source maps so browser stack traces show the original code, then deletes the
      # .map files and their sourceMappingURL comments so they are not served. Skipped without the secret.
      - name: Upload source maps to PostHog
        if: env.POSTHOG_CLI_API_KEY != ''
        env:
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
        run: |
          # The CLI talks to the app host (us.posthog.com), not the ingestion host (us.i.posthog.com)
          pnpm dlx @posthog/cli@0.19.4 --host "${PUBLIC_POSTHOG_HOST/.i.posthog.com/.posthog.com}" \
            sourcemap process --directory dist/client --delete-after \
            --release-name imeankenshin.com --release-version "$GITHUB_SHA"
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
