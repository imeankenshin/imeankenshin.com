name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  # 公開処理を途中で止めず、クローズ時の削除を最後に実行する。
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
        env:
          CLOUDFLARE_ENV: preview
      - run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
      - name: Create or update Cloudflare Preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/cloudflare-preview.jsonl
        run: |
          pnpm exec wrangler deploy --name "imeankenshin-com-pr-${PR_NUMBER}"
          url="$(jq -ser '[.[] | select(.type == "deploy")] | last | .targets[] | select(endswith(".workers.dev")) | if startswith("https://") then . else "https://" + . end' "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '### PR preview\n\n%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Update preview comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- cloudflare-pr-preview -->';
            const body = `${marker}\nCloudflareプレビュー: ${process.env.PREVIEW_URL}\n\nコミット: ${context.payload.pull_request.head.sha}`;
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      # クローズ時は信頼されたベースブランチの設定・依存関係を使う。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete Cloudflare Preview
        run: |
          deletion_log="${RUNNER_TEMP}/cloudflare-preview-delete.log"
          if pnpm exec wrangler delete --name "imeankenshin-com-pr-${PR_NUMBER}" --force > "$deletion_log" 2>&1; then
            cat "$deletion_log"
          elif grep -Eq '\[code: (10007|10090)\]' "$deletion_log"; then
            echo "Preview Worker is already absent; nothing to delete."
          else
            cat "$deletion_log" >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
